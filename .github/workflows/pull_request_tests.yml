name: Pull request tests

on: pull_request

jobs:
  dart-analysis:
    name: Dart analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Generate source files
        run: |
          flutter gen-l10n
          dart run build_runner build

      # Switch back once https://github.com/dart-lang/sdk/issues/60236 is released
      # - name: Analyze Dart
      #   uses: zgosalvez/github-actions-analyze-dart@v3
      - name: Analyze Dart
        run: dart format -o none --set-exit-if-changed .

  test-android-build:
    name: Test android build
    runs-on: ubuntu-latest
    steps:
      - name: Install android dependencies
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      # Cache the Gradle wrapper and dependencies, so a flaky download doesn't fail the build.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pull request runs save the cache too, so one good download is kept.
          cache-read-only: false

      # Retry, as the Gradle and Maven downloads sometimes fail with a 504. One ABI is enough to prove the build works;
      # the release workflow still builds all of them.
      - name: Build Flutter app
        run: |
          dart run build_runner build
          for attempt in 1 2 3 4 5; do
            flutter build -v apk --target-platform android-arm64 && exit 0
            echo "Build failed (attempt $attempt of 5), retrying in $((attempt * 60)) seconds."
            sleep $((attempt * 60))
          done
          exit 1

  test-linux-build:
    name: Test linux build
    runs-on: ubuntu-latest
    steps:
      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev libmpv-dev mpv

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Build Flutter app
        run: |
          dart run build_runner build
          flutter build -v linux

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Generate source files
        run: |
          flutter gen-l10n
          dart run build_runner build

      - name: Run tests
        run: |
          if [ -d test ]; then flutter test; fi
